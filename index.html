<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>野球成績管理</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;
    background:#f4f6f8;
    color:#222;
}

button,input,select{font:inherit}

button{cursor:pointer}

.hidden{display:none!important}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

h1,h2,h3{margin-top:0}

.btn{
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-weight:bold;
    margin:3px;
}

.blue{
    background:#0866d6;
    color:white;
}

.gray{
    background:#eee;
    color:#333;
}

.red{
    background:#e53935;
    color:white;
}

.green{
    background:#198754;
    color:white;
}

input,select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
}

label{
    font-size:13px;
    font-weight:bold;
    color:#555;
    display:block;
    margin-bottom:5px;
}

.form{
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

/* LOGIN */

.login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#0757c8,#1592e6);
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.login-box h1{
    text-align:center;
    color:#0757c8;
}

.login-box button{
    width:100%;
    margin-top:10px;
}

.suggestion-box{
    position:relative;
}

.suggestions{
    position:absolute;
    z-index:20;
    left:0;
    right:0;
    top:100%;
    background:white;
    border:1px solid #ddd;
    border-radius:0 0 8px 8px;
    overflow:hidden;
}

.suggestion{
    padding:12px;
    cursor:pointer;
}

.suggestion:hover{
    background:#edf4ff;
}

/* HEADER */

.header{
    height:62px;
    background:#0757c8;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

/* LAYOUT */

.layout{
    display:flex;
    min-height:calc(100vh - 62px);
}

.sidebar{
    width:220px;
    background:white;
    padding:15px;
    border-right:1px solid #ddd;
}

.side-btn{
    width:100%;
    text-align:left;
    border:none;
    background:white;
    padding:13px;
    border-radius:8px;
    font-weight:bold;
    margin-bottom:5px;
}

.side-btn:hover,
.side-btn.active{
    background:#eaf2ff;
    color:#0757c8;
}

.main{
    flex:1;
    padding:25px;
}

/* GAME */

.game{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.game-info{
    flex:1;
}

.game-info small{
    display:block;
    color:#777;
    margin-top:5px;
}

/* PA */

.pa{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.pa-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
}

.pa-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 100px 100px 100px;
    gap:10px;
    margin-top:12px;
}

/* PREVIEW */

.preview{
    margin-top:20px;
    border:1px solid #ddd;
    border-radius:12px;
    overflow:hidden;
    background:white;
}

.preview-title{
    background:#f0f3f7;
    padding:12px;
    font-weight:bold;
}

.preview-row{
    display:grid;
    grid-template-columns:100px 1fr 80px 80px 80px;
    gap:10px;
    padding:12px;
    border-bottom:1px solid #eee;
}

.total{
    padding:15px;
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    font-weight:bold;
}

/* TABLE */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:center;
    white-space:nowrap;
}

th{
    background:#f0f3f7;
    font-size:13px;
}

/* STAT */

.stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:12px;
}

.stat{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.stat-name{
    font-size:13px;
    color:#777;
}

.stat-value{
    font-size:25px;
    font-weight:bold;
    margin-top:5px;
}

/* RANK */

.rank-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.rank-tab{
    border:1px solid #ccc;
    background:white;
    border-radius:20px;
    padding:8px 15px;
}

.rank-tab.active{
    background:#0757c8;
    color:white;
    border-color:#0757c8;
}

@media(max-width:800px){

    .layout{
        display:block;
    }

    .sidebar{
        width:100%;
        display:flex;
        overflow-x:auto;
        border-right:none;
        border-bottom:1px solid #ddd;
    }

    .side-btn{
        width:auto;
        min-width:110px;
        white-space:nowrap;
        text-align:center;
    }

    .main{
        padding:15px;
    }

    .pa-grid{
        grid-template-columns:1fr 1fr;
    }

    .game{
        flex-direction:column;
        align-items:flex-start;
    }

    .preview-row{
        grid-template-columns:70px 1fr 60px 60px 60px;
        font-size:13px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
初回管理者設定
===================================================== -->

<div id="setupPage" class="login hidden">

<div class="login-box">

<h1>⚾ 初期設定</h1>

<p>
このサイトを使用するために<br>
管理者アカウントを作成してください。
</p>

<div class="form">
<label>管理者名</label>
<input id="setupName" placeholder="例：監督">
</div>

<div class="form">
<label>パスワード</label>
<input id="setupPassword" type="password" placeholder="好きなパスワード">
</div>

<div class="form">
<label>パスワード確認</label>
<input id="setupPassword2" type="password" placeholder="もう一度入力">
</div>

<button class="btn blue" onclick="createAdmin()">
管理者アカウントを作成
</button>

</div>
</div>


<!-- =====================================================
ログイン
===================================================== -->

<div id="loginPage" class="login hidden">

<div class="login-box">

<h1>⚾ 野球成績管理</h1>

<p style="text-align:center;color:#777">
選手ログイン
</p>

<div class="form suggestion-box">

<label>選手名</label>

<input
id="loginName"
placeholder="名前を入力してください"
autocomplete="off"
>

<div id="suggestions" class="suggestions hidden"></div>

</div>

<button class="btn blue" onclick="playerLogin()">
選手としてログイン
</button>

<button class="btn gray" onclick="showAdminLogin()">
管理者ログイン
</button>

</div>
</div>


<!-- =====================================================
管理者ログイン
===================================================== -->

<div id="adminLoginPage" class="login hidden">

<div class="login-box">

<h1>管理者ログイン</h1>

<div class="form">

<label>管理者名</label>

<input id="adminLoginName">

</div>

<div class="form">

<label>パスワード</label>

<input id="adminLoginPassword" type="password">

</div>

<button class="btn blue" onclick="adminLogin()">
ログイン
</button>

<button class="btn gray" onclick="backLogin()">
戻る
</button>

</div>
</div>


<!-- =====================================================
選手画面
===================================================== -->

<div id="playerApp" class="hidden">

<header class="header">

<b>⚾ 野球成績管理</b>

<div class="header-right">

<span id="playerNameHeader"></span>

<button class="btn gray" onclick="logout()">
ログアウト
</button>

</div>

</header>


<div class="layout">

<aside class="sidebar">

<button
class="side-btn active"
onclick="playerPage('input',this)">
📝 成績入力
</button>

<button
class="side-btn"
onclick="playerPage('total',this)">
📊 累計成績
</button>

<button
class="side-btn"
onclick="playerPage('ranking',this)">
🏆 ランキング
</button>

</aside>


<main class="main">

<!-- 成績入力 -->

<section id="playerInputPage">

<h2>📝 成績入力</h2>

<div class="card">

<h3>試合を選択</h3>

<div id="playerGames"></div>

</div>


<div id="inputCard" class="card hidden">

<h3 id="selectedGameTitle"></h3>

<div id="plateAppearances"></div>

<button class="btn gray" onclick="addPA()">
＋ 打席を追加
</button>

<button class="btn blue" onclick="saveRecord()">
成績を保存
</button>

<div id="todayPreview"></div>

</div>

</section>


<!-- 累計 -->

<section id="playerTotalPage" class="hidden">

<h2>📊 累計成績</h2>

<div id="playerTotal"></div>

</section>


<!-- ランキング -->

<section id="playerRankingPage" class="hidden">

<h2>🏆 ランキング</h2>

<div id="playerRanking"></div>

</section>

</main>

</div>
</div>


<!-- =====================================================
管理者画面
===================================================== -->

<div id="adminApp" class="hidden">

<header class="header">

<b>⚾ 野球成績管理 - 管理者</b>

<div>

<span id="adminNameHeader"></span>

<button class="btn gray" onclick="logout()">
ログアウト
</button>

</div>

</header>


<main class="container">

<div class="rank-tabs">

<button
class="rank-tab active"
onclick="adminPage('games',this)">
試合管理
</button>

<button
class="rank-tab"
onclick="adminPage('players',this)">
選手管理
</button>

<button
class="rank-tab"
onclick="adminPage('stats',this)">
累計成績
</button>

<button
class="rank-tab"
onclick="adminPage('ranking',this)">
ランキング
</button>

</div>


<!-- 試合管理 -->

<section id="adminGamesPage">

<div class="card">

<h2>⚾ 試合登録</h2>

<div class="grid">

<div class="form">
<label>日付</label>
<input id="gameDate" type="date">
</div>

<div class="form">
<label>試合名</label>
<input id="gameName" placeholder="例：春季リーグ第1戦">
</div>

<div class="form">
<label>対戦相手</label>
<input id="gameOpponent" placeholder="例：○○大学">
</div>

<div class="form">
<label>球場</label>
<input id="gameStadium" placeholder="例：○○球場">
</div>

</div>

<button class="btn blue" onclick="registerGame()">
試合を登録
</button>

</div>


<div class="card">

<h2>登録済み試合</h2>

<div id="adminGames"></div>

</div>

</section>


<!-- 選手管理 -->

<section id="adminPlayersPage" class="hidden">

<div class="card">

<h2>👤 選手登録</h2>

<div class="grid">

<div class="form">

<label>背番号</label>

<input id="newNumber" placeholder="例：10">

</div>

<div class="form">

<label>選手名</label>

<input id="newName" placeholder="例：山田太郎">

</div>

</div>

<button class="btn blue" onclick="registerPlayer()">
選手を登録
</button>

</div>


<div class="card">

<h2>登録選手</h2>

<div id="adminPlayers"></div>

</div>

</section>


<!-- 累計 -->

<section id="adminStatsPage" class="hidden">

<h2>📊 累計成績</h2>

<div id="adminStats"></div>

</section>


<!-- ランキング -->

<section id="adminRankingPage" class="hidden">

<h2>🏆 ランキング</h2>

<div id="adminRanking"></div>

</section>

</main>
</div>


<script>

/* =====================================================
データ
===================================================== */

const ADMIN_KEY="baseball_admin";
const PLAYERS_KEY="baseball_players";
const GAMES_KEY="baseball_games";
const RECORDS_KEY="baseball_records";

let admin=load(ADMIN_KEY);

let players=load(PLAYERS_KEY);

let games=load(GAMES_KEY);

let records=load(RECORDS_KEY);

let currentPlayer=null;

let selectedGame=null;

let pas=[];

let rankingType="OPS";


function load(key){

try{

const x=localStorage.getItem(key);

return x ? JSON.parse(x) : null;

}catch(e){

return null;

}

}


function save(){

localStorage.setItem(
PLAYERS_KEY,
JSON.stringify(players)
);

localStorage.setItem(
GAMES_KEY,
JSON.stringify(games)
);

localStorage.setItem(
RECORDS_KEY,
JSON.stringify(records)
);

if(admin){

localStorage.setItem(
ADMIN_KEY,
JSON.stringify(admin)
);

}

}


function esc(x){

return String(x??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function avg(x){

return x.toFixed(3).replace("0.",".");

}


function dateText(x){

if(!x)return "";

const d=new Date(x+"T00:00:00");

return d.getFullYear()+"/"+
String(d.getMonth()+1).padStart(2,"0")+"/"+
String(d.getDate()).padStart(2,"0");

}


/* =====================================================
起動
===================================================== */

function init(){

if(!players)players=[];

if(!games)games=[];

if(!records)records=[];

if(!admin){

document.getElementById("setupPage")
.classList.remove("hidden");

}else{

document.getElementById("loginPage")
.classList.remove("hidden");

}

const d=new Date();

document.getElementById("gameDate").value=
d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

}

init();


/* =====================================================
初回管理者設定
===================================================== */

function createAdmin(){

const name=
document.getElementById("setupName").value.trim();

const pass=
document.getElementById("setupPassword").value;

const pass2=
document.getElementById("setupPassword2").value;

if(!name){

alert("管理者名を入力してください");

return;

}

if(!pass){

alert("パスワードを入力してください");

return;

}

if(pass!==pass2){

alert("パスワードが一致していません");

return;

}

if(pass.length<4){

alert("パスワードは4文字以上にしてください");

return;

}

admin={
name:name,
password:pass
};

localStorage.setItem(
ADMIN_KEY,
JSON.stringify(admin)
);

alert("管理者アカウントを作成しました！");

location.reload();

}


/* =====================================================
ログイン
===================================================== */

function showAdminLogin(){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("adminLoginPage")
.classList.remove("hidden");

}


function backLogin(){

document.getElementById("adminLoginPage")
.classList.add("hidden");

document.getElementById("loginPage")
.classList.remove("hidden");

}


function adminLogin(){

const name=
document.getElementById("adminLoginName").value.trim();

const pass=
document.getElementById("adminLoginPassword").value;

if(
name!==admin.name ||
pass!==admin.password
){

alert("管理者名またはパスワードが違います");

return;

}

document.getElementById("adminLoginPage")
.classList.add("hidden");

document.getElementById("adminApp")
.classList.remove("hidden");

document.getElementById("adminNameHeader")
.textContent=admin.name;

renderAdminGames();

}


function playerLogin(){

const name=
document.getElementById("loginName").value.trim();

const player=
players.find(p=>p.name===name);

if(!player){

alert("登録されている選手名を選択してください");

return;

}

currentPlayer=player;

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("playerApp")
.classList.remove("hidden");

document.getElementById("playerNameHeader")
.textContent=
(player.number ? player.number+" " : "")+
player.name;

renderPlayerGames();

}


function logout(){

location.reload();

}


/* =====================================================
選手名候補
===================================================== */

document.getElementById("loginName")
.addEventListener("input",function(){

const word=this.value.trim().toLowerCase();

const box=document.getElementById("suggestions");

if(!word){

box.classList.add("hidden");

return;

}

const result=
players.filter(
p=>p.name.toLowerCase().includes(word)
);

box.innerHTML=result.map(p=>`

<div
class="suggestion"
onclick="choosePlayer('${esc(p.name)}')">

${esc(p.number)}
　${esc(p.name)}

</div>

`).join("");

box.classList.toggle(
"hidden",
result.length===0
);

});


function choosePlayer(name){

document.getElementById("loginName").value=name;

document.getElementById("suggestions")
.classList.add("hidden");

}


/* =====================================================
管理者：選手登録
===================================================== */

function registerPlayer(){

const number=
document.getElementById("newNumber").value.trim();

const name=
document.getElementById("newName").value.trim();

if(!name){

alert("選手名を入力してください");

return;

}

if(players.some(p=>p.name===name)){

alert("その選手はすでに登録されています");

return;

}

players.push({

id:
"p_"+Date.now()+"_"+Math.random(),

number:number,

name:name

});

save();

document.getElementById("newNumber").value="";

document.getElementById("newName").value="";

renderAdminPlayers();

alert("選手を登録しました");

}


function deletePlayer(id){

if(!confirm("この選手を削除しますか？"))return;

players=players.filter(p=>p.id!==id);

records=records.filter(r=>r.playerId!==id);

save();

renderAdminPlayers();

}


function renderAdminPlayers(){

const box=document.getElementById("adminPlayers");

if(!players.length){

box.innerHTML="<p>まだ選手が登録されていません。</p>";

return;

}

box.innerHTML=`

<div class="table-wrap">

<table>

<tr>
<th>背番号</th>
<th>選手名</th>
<th>操作</th>
</tr>

${players.map(p=>`

<tr>

<td>${esc(p.number)}</td>

<td><b>${esc(p.name)}</b></td>

<td>

<button
class="btn red"
onclick="deletePlayer('${p.id}')">
削除
</button>

</td>

</tr>

`).join("")}

</table>

</div>

`;

}


/* =====================================================
管理者：試合登録
===================================================== */

function registerGame(){

const date=
document.getElementById("gameDate").value;

const name=
document.getElementById("gameName").value.trim();

const opponent=
document.getElementById("gameOpponent").value.trim();

const stadium=
document.getElementById("gameStadium").value.trim();

if(!date||!name||!opponent){

alert("日付・試合名・対戦相手を入力してください");

return;

}

games.push({

id:
"g_"+Date.now()+"_"+Math.random(),

date:date,

name:name,

opponent:opponent,

stadium:stadium

});

save();

document.getElementById("gameName").value="";

document.getElementById("gameOpponent").value="";

document.getElementById("gameStadium").value="";

renderAdminGames();

alert("試合を登録しました！\n選手側にも表示されます。");

}


function deleteGame(id){

if(!confirm(
"この試合を削除しますか？\n入力された成績も削除されます。"
))return;

games=games.filter(g=>g.id!==id);

records=records.filter(r=>r.gameId!==id);

save();

renderAdminGames();

}


function renderAdminGames(){

const box=document.getElementById("adminGames");

const list=
[...games].sort(
(a,b)=>b.date.localeCompare(a.date)
);

if(!list.length){

box.innerHTML="<p>試合が登録されていません。</p>";

return;

}

box.innerHTML=list.map(g=>`

<div class="game">

<div class="game-info">

<b>
${dateText(g.date)}
　
${esc(g.name)}
</b>

<small>
vs ${esc(g.opponent)}
${g.stadium ? " / "+esc(g.stadium):""}
</small>

</div>

<button
class="btn red"
onclick="deleteGame('${g.id}')">
削除
</button>

</div>

`).join("");

}


/* =====================================================
選手：試合一覧
===================================================== */

function renderPlayerGames(){

const box=document.getElementById("playerGames");

const list=
[...games].sort(
(a,b)=>b.date.localeCompare(a.date)
);

if(!list.length){

box.innerHTML=
"<p>現在入力できる試合がありません。</p>";

return;

}

box.innerHTML=list.map(g=>{

const exists=
records.some(
r=>
r.playerId===currentPlayer.id &&
r.gameId===g.id
);

return`

<div class="game">

<div class="game-info">

<b>
${dateText(g.date)}
　
${esc(g.name)}
</b>

<small>
vs ${esc(g.opponent)}
${g.stadium ? " / "+esc(g.stadium):""}
</small>

${exists
?`<small style="color:#0866d6;font-weight:bold">
✓ 入力済み
</small>`
:""}

</div>

<button
class="btn blue"

/* =====================================================
計算
===================================================== */

function atBat(result){

return[
"ゴロ",
"飛",
"直",
"邪飛",
"失",
"野選",
"安",
"二",
"三",
"本",
"三振",
"振り逃げ",
"併殺"
].includes(result);

}


function hit(result){

return[
"安",
"二",
"三",
"本"
].includes(result);

}


function bases(result){

if(result==="安")return 1;

if(result==="二")return 2;

if(result==="三")return 3;

if(result==="本")return 4;

return 0;

}


function calculate(playerId){

const rs=
records.filter(
r=>r.playerId===playerId
);

const all=
rs.flatMap(r=>r.pas||[]);

const PA=
all.filter(
p=>
p.result &&
p.result!=="犠打" &&
p.result!=="犠飛"
).length;

const AB=
all.filter(
p=>atBat(p.result)
).length;

const H=
all.filter(
p=>hit(p.result)
).length;

const BB=
all.filter(
p=>
p.result==="四球"||
p.result==="死球"
).length;

const TB=
all.reduce(
(a,p)=>a+bases(p.result),0
);

const HR=
all.filter(
p=>p.result==="本"
).length;

const doubles=
all.filter(
p=>p.result==="二"
).length;

const triples=
all.filter(
p=>p.result==="三"
).length;

const RBI=
all.reduce(
(a,p)=>a+Number(p.rbi||0),0
);

const R=
all.reduce(
(a,p)=>a+Number(p.run||0),0
);

const SB=
all.reduce(
(a,p)=>a+Number(p.steal||0),0
);

const SO=
all.filter(
p=>
p.result==="三振"||
p.result==="振り逃げ"
).length;

const SF=
all.filter(
p=>p.result==="犠飛"
).length;

const AVG=
AB?H/AB:0;

const OBP=
(AB+BB+SF)
?(H+BB)/(AB+BB+SF)
:0;

const SLG=
AB?TB/AB:0;

const OPS=OBP+SLG;


/* 得点圏 */

const scoring=
all.filter(
p=>p.scoring&&p.result
);

const scoringAB=
scoring.filter(
p=>atBat(p.result)
).length;

const scoringH=
scoring.filter(
p=>hit(p.result)
).length;

const scoringAVG=
scoringAB
?scoringH/scoringAB
:0;

return{

G:rs.length,
PA,
AB,
H,
doubles,
triples,
HR,
BB,
SO,
RBI,
R,
SB,
AVG,
OBP,
SLG,
OPS,
scoringAVG

};

}


/* =====================================================
今日の成績
===================================================== */

function renderToday(){

const box=
document.getElementById("todayPreview");

let PA=0;
let AB=0;
let H=0;
let BB=0;
let RBI=0;
let R=0;
let SB=0;

const rows=pas.map((p,i)=>{

if(
p.result &&
p.result!=="犠打" &&
p.result!=="犠飛"
)PA++;

if(atBat(p.result))AB++;

if(hit(p.result))H++;

if(
p.result==="四球"||
p.result==="死球"
)BB++;

RBI+=Number(p.rbi||0);

R+=Number(p.run||0);

SB+=Number(p.steal||0);

let result=p.result||"－";

if(p.position&&p.result){

result=p.position+p.result;

}

return`

<div class="preview-row">

<div>${i+1}打席目</div>

<div>
<b>${esc(result)}</b>
${p.scoring?" 🎯":""}
</div>

<div>打点${p.rbi||0}</div>

<div>得点${p.run||0}</div>

<div>盗塁${p.steal||0}</div>

</div>

`;

}).join("");


box.innerHTML=`

<div class="preview">

<div class="preview-title">
📋 この日の成績
</div>

${rows}

<div class="total">

<span>累計</span>
<span>${PA}打席</span>
<span>${AB}打数</span>
<span>${H}安打</span>
<span>四死球${BB}</span>
<span>打点${RBI}</span>
<span>得点${R}</span>
<span>盗塁${SB}</span>

</div>

</div>

`;

}


/* =====================================================
保存
===================================================== */

function saveRecord(){

if(!selectedGame){

alert("試合を選択してください");

return;

}

if(!pas.some(p=>p.result)){

alert("少なくとも1打席入力してください");

return;

}

const index=
records.findIndex(
r=>
r.playerId===currentPlayer.id &&
r.gameId===selectedGame.id
);

const data={

id:
index>=0
?records[index].id
:"r_"+Date.now(),

playerId:currentPlayer.id,

gameId:selectedGame.id,

pas:JSON.parse(JSON.stringify(pas))

};

if(index>=0){

records[index]=data;

}else{

records.push(data);

}

save();

renderPlayerGames();

alert("成績を保存しました！");

}

function rankKey(type){

"打率":"AVG",
"OPS":"OPS",
"安打":"H",
"本塁打":"HR",
"打点":"RBI",
"盗塁":"SB",
"得点圏打率":"scoringAVG"

}[type];

}


function rankingHTML(){

const key=rankKey(rankingType);

);
