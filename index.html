<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルなWebサイト</title>

  <style>
    /* ページ全体 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding-bottom: 100px;
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #f5f5f5;
    }

    /* header */
    header {
      padding: 30px 20px;
      text-align: center;
      color: white;
      background-color: #440000;
    }

    header h1 {
      margin: 0;
    }

    /* main */
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #cc0000;
    }

    section {
      margin-bottom: 40px;
      padding: 25px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      margin-top: 0;
      color: #cc0000;
    }

    /* footer */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 15px;
      text-align: center;
      color: white;
      background-color: #440000;
    }

    footer p {
      margin: 0 0 8px;
    }

    footer a {
      margin: 0 8px;
      color: white;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>成績管理</h1>
  </header>

  <main>
    <section>
      <h2>総合成績</h2>
      <p>
        ここではすべての成績を見ることができます。
      </p>
    </section>

    <section>
      <h2>ランキング</h2>
      <p>ここでは選手間のランキングを見ることができます。</p>
      <img src="https://github.com/mahiro1212/Baseball-Database/blob/main/cupcake.jpg?raw=true" alt="サンプル">
    </section>
  </main>

  <footer>
    <p>お問い合わせ：info@example.com</p>
    <div>
      <a href="#">X</a>
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
    </div>
  </footer>

</body>
</html>
